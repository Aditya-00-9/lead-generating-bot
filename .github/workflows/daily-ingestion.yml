# Daily at 14:00 UTC = 19:30 IST (7:30 PM India). Re-push this file if schedule shows 0 runs.
name: Daily lead ingestion

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-lead-ingestion
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  migrate-and-ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Actions secrets (hosted Postgres required)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "GITHUB_SHA=${GITHUB_SHA:-unknown}"
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Set the repository secret DATABASE_URL to your hosted Postgres URL (Neon/Supabase/RDS). See README → CI/CD."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
      - name: Run database migrations
        env:
          SYNC_DATABASE_URL: ${{ secrets.SYNC_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          export SYNC_DATABASE_URL="$(python scripts/alembic_database_url.py)"
          alembic upgrade head
      - name: Run lead monitor
        env:
          APP_ENV: production
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_TRIAGE_MODEL: ${{ secrets.OPENAI_TRIAGE_MODEL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SYNC_DATABASE_URL: ${{ secrets.SYNC_DATABASE_URL }}
          KEYWORDS: ${{ secrets.KEYWORDS }}
          MIN_ENRICH_SCORE: "50"
          MAX_ITEMS_PER_QUERY: "25"
          OPENAI_WEB_RESEARCH_MULTI_QUERY: "true"
          OPENAI_WEB_RESEARCH_MAX_SEARCHES: "18"
          OPENAI_WEB_RESEARCH_SEARCH_CONCURRENCY: "3"
          OPENAI_WEB_RESEARCH_COMPETITORS_PER_RUN: "4"
          OPENAI_WEB_RESEARCH_DISCOVERY_POOL_SIZE: "80"
          OPENAI_WEB_RESEARCH_MAX_TOOL_CALLS_PER_SEARCH: "4"
          OPENAI_WEB_RESEARCH_DEEP_EXTRACT: "true"
          OPENAI_WEB_RESEARCH_DEEP_EXTRACT_LIMIT: "12"
          OPENAI_WEB_RESEARCH_DEEP_EXTRACT_CONCURRENCY: "5"
          OPENAI_COLLECTION_MIN_RELEVANCE: "45"
          GOOGLE_ALERT_RSS_URLS: ${{ secrets.GOOGLE_ALERT_RSS_URLS }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: kramaai-lead-monitor/1.0
          REDDIT_SUBREDDITS: smallbusiness,fitnessbusiness,martialarts,gymowners,yoga,pilates,crossfit,SaaS
        run: |
          set -euo pipefail
          export SYNC_DATABASE_URL="${SYNC_DATABASE_URL:-$DATABASE_URL}"
          python -m app.scheduler.runner
      - name: Upload Excel reports as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lead-reports-${{ github.run_id }}
          path: reports/*.xlsx
          if-no-files-found: warn
